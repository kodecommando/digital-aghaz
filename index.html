    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable && typeof desc.get === 'function' && typeof desc.set === 'undefined') {
            var origGet = desc.get;
            var customFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: Boolean(desc.enumerable),
              get: function () { return customFetch || origGet.call(window); },
              set: function (fn) { if (typeof fn === 'function') customFetch = fn; }
            });
          }
        } catch (e) {}
        function isExtErr(msg, src, stack) {
          var s = String(src || '') + ' ' + String(stack || '');
          if (s.indexOf('chrome-extension://') !== -1 || s.indexOf('moz-extension://') !== -1 || s.indexOf('safari-extension://') !== -1) {
            return true;
          }
          return String(msg || '').indexOf('Cannot set property fetch of #<Window> which has only a getter') !== -1 && s.indexOf('/src/') === -1;
        }
        window.addEventListener('error', function (ev) {
          if (isExtErr(ev && ev.message, ev && ev.filename, ev && ev.error && ev.error.stack)) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          if (isExtErr(r && r.message ? r.message : r, '', r && r.stack)) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('da_theme');
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('da_lang');
          if (savedLang === 'ur') {
            root.lang = 'ur';
            root.dir = 'rtl';
            root.classList.add('rtl');
            root.classList.remove('ltr');
          } else {
            root.lang = 'en';
            root.dir = 'ltr';
            root.classList.add('ltr');
            root.classList.remove('rtl');
          }
        } catch (e) {}
      })();
    </script>
